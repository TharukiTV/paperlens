# Local Postgres with the pgvector extension for PaperLens.
#   docker compose up -d        start it (on localhost:5433, so it doesn't clash with a local Postgres on 5432)
#   docker compose down         stop it (data is kept in the pgdata volume)
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperlens
      POSTGRES_PASSWORD: paperlens
      POSTGRES_DB: paperlens
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperlens -d paperlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
