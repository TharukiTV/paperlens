  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Upload a research paper, get a structured summary, and ask questions with page-cited answers." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>PaperLens: research assistant for PDFs</title>
    <script>
      // Apply the saved theme before first paint, so there's no flash of the wrong colours.
      try { var t = localStorage.getItem("paperlens-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>

    <script type="module" src="/src/main.jsx"></script>
